{% if is_paginated %}
<nav class="pagination" aria-label="Pages">
  {% if page_obj.has_previous %}
    <a class="button button--ghost" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
  {% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="button button--ghost" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
  {% endif %}
</nav>
{% endif %}
