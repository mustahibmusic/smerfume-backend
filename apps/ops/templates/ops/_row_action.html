{% if action.kind == "quick" %}<button type="button" class="row-action" data-quick-view="{{ action.url }}" data-action-kind="quick">{{ action.label }}</button>{% elif action.is_post %}<form method="post" action="{{ action.url }}" class="row-action-form" data-confirm="{{ action.confirm }}">{% csrf_token %}{% for name, value in action.fields %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}<button type="submit" class="row-action{% if action.danger %} row-action--danger{% endif %}" data-action-kind="{{ action.kind }}">{{ action.label }}</button></form>{% else %}<a class="row-action" href="{{ action.url }}" data-action-kind="{{ action.kind }}">{{ action.label }}</a>{% endif %}
