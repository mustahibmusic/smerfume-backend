<header class="topbar">
  <button type="button" class="icon-button topbar__menu" data-nav-toggle aria-controls="ops-sidebar" aria-expanded="false" aria-label="Open navigation">
    {% include "ops/_icon.html" with name="menu" %}
  </button>
  <div class="topbar__title">{% block page_title %}{% endblock %}</div>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'ops:logout' %}" class="topbar__logout">
      {% csrf_token %}
      <button type="submit" class="button button--ghost">
        {% include "ops/_icon.html" with name="logout" %}<span>Log out</span>
      </button>
    </form>
  {% endif %}
</header>
