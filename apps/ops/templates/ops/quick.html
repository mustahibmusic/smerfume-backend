{% comment %}Quick view layout: a detail page rendered as read-only drawer content (no shell, no forms or page actions). Loaded by ops.js into the list page's drawer.{% endcomment %}
<div class="quick" data-quick-content>
  <div class="quick__title">{% block page_title %}{% endblock %}</div>
  {% block content %}{% endblock %}
  <p class="quick__full"><a class="button" href="{{ request.path }}">Open full page</a></p>
</div>
