{% extends "admin/base_site.html" %}

{% block breadcrumbs %}{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <p class="mb-6 text-sm">{{ message }}</p>
    <ul class="list-disc mb-6 ml-6 text-sm">
        {% for obj in queryset %}<li>{{ obj }}</li>{% endfor %}
    </ul>

    <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="action" value="{{ action }}">
        {% for obj in queryset %}
            <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
        {% endfor %}
        <input type="hidden" name="confirm" value="yes">

        <div class="flex gap-4 mt-4">
            <button type="submit"
                    class="{{ button_class }} border border-transparent font-medium px-3 py-2 rounded-default text-sm text-white">
                {{ button_label }}
            </button>
            <a href="{{ back_url }}"
               class="border border-base-200 font-medium px-3 py-2 rounded-default text-sm">
                Go back
            </a>
        </div>
    </form>
</div>
{% endblock %}
